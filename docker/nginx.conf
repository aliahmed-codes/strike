server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies API calls to the server container so the client can always
    # call same-origin "/api/..." paths, in dev and in this container setup.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
